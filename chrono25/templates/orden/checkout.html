{% extends 'general/layout.html' %}

{% block head_title %}Carrito de Compras{% endblock %}


{% block page_content %}
{% include '_includes/_messages.html' %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h2 class="card-title mb-4">Finalizar Pedido</h2>

                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="id_direccion" class="form-label fw-bold">Dirección de Envío</label>
                            <input type="text" name="direccion" id="id_direccion" class="form-control" placeholder="Ej. Calle Mayor 12, 3ºA, Madrid" required>
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-success btn-lg">
                                Confirmar y Pagar
                            </button>
                            <a href="{% url 'ver_carrito' %}" class="btn btn-outline-secondary">
                                Volver al carrito
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
