<div class="col-md-4 mb-4">
    <div class="card h-100 shadow-sm">
        <div class="ratio ratio-4x3">
            <img src="{{ product.image.url }}" class="card-img-top object-fit-cover" alt="{{ product.marca }}">
        </div>

        <div class="card-body d-flex flex-column">
            <h5 class="card-title mb-1">{{ product.marca }}</h5>
            <p class="card-subtitle text-muted mb-3">{{ product.modelo }}</p>

            <div class="mt-auto pt-2">
                <a href="{% url 'detalle_producto' product.id %}" class="btn btn-outline-primary w-100">
                    Ver Detalle
                </a>
            </div>
        </div>
    </div>
</div>
